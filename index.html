<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>NISP 刷题</title>
  <!-- 内联 favicon，避免 file:// 或静态服务下的 404 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📝</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=20261118">
</head>
<body>
  <!-- .app 容器：承载 PC 端 960px 居中 + 底部安全区留白 -->
  <div class="app">
    <!-- 顶部标题栏 -->
    <header id="topbar" class="topbar">
      <div class="topbar-inner">
        <div class="topbar-actions left" id="topbar-back"></div>
        <div id="page-title" class="topbar-title">NISP 刷题</div>
        <div class="topbar-actions right" id="topbar-right">
          <a href="#/mine" class="topbar-avatar" id="topbar-avatar" aria-label="我的">我</a>
        </div>
      </div>
    </header>

    <!-- 主内容区：视图由 app.js 渲染 -->
    <main id="main" class="main">
      <!-- 首屏骨架：题库下载完成前先显示，避免长时间白屏 -->
      <div class="boot-loading" id="boot-loading">
        <div class="boot-spinner"></div>
        <p class="boot-title">正在加载题库</p>
        <p class="boot-tip" id="boot-tip">首次打开需要下载题库，请稍候…</p>
      </div>
    </main>

    <!-- 底部导航栏（练习/考试等页面会被隐藏，改由操作栏接管） -->
    <nav id="bottombar" class="nav-bar">
      <a href="#/home" class="nav-item" data-nav="home">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.2 10.7 12 3.5l8.8 7.2"/>
            <path d="M5.6 9.6V20.5h12.8V9.6"/>
            <path d="M9.8 20.5v-5.6h4.4v5.6"/>
          </svg>
        </span>
        <span class="nav-label">首页</span>
      </a>
      <a href="#/chapter" class="nav-item" data-nav="chapter">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 6.3C10.4 4.9 8.3 4.2 4.6 4.2v14.2c3.7 0 5.8.7 7.4 2.1 1.6-1.4 3.7-2.1 7.4-2.1V4.2c-3.7 0-5.8.7-7.4 2.1Z"/>
            <path d="M12 6.3v14.2"/>
          </svg>
        </span>
        <span class="nav-label">练习</span>
      </a>
      <a href="#/exam" class="nav-item" data-nav="exam">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="4.2" width="14" height="16.6" rx="2.6"/>
            <path d="M9.2 4.2v-1h5.6v1"/>
            <path d="m9.2 12.4 2 2 3.6-3.8"/>
          </svg>
        </span>
        <span class="nav-label">考试</span>
      </a>
      <a href="#/wrong" class="nav-item" data-nav="wrong">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8.8"/>
            <path d="m9.3 9.3 5.4 5.4M14.7 9.3l-5.4 5.4"/>
          </svg>
        </span>
        <span class="nav-label">错题</span>
      </a>
      <a href="#/mine" class="nav-item" data-nav="mine">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8.2" r="3.7"/>
            <path d="M4.6 20.4a7.4 7.4 0 0 1 14.8 0"/>
          </svg>
        </span>
        <span class="nav-label">我的</span>
      </a>
    </nav>
  </div>

  <!-- 存储层 -->
  <script src="js/storage.js?v=20261118"></script>
  <!-- 认证与云端同步 -->
  <script src="js/auth.js?v=20261118"></script>
  <!-- 路由层 -->
  <script src="js/router.js?v=20261118"></script>
  <!-- 业务层 -->
  <script src="js/app.js?v=20261118"></script>
  <!-- 题库异步加载 + 启动应用：先出界面骨架，再拉题库，避免白屏等待 -->
  <script>
    (function () {
      'use strict';
      var mainEl = document.getElementById('main');
      var loadingEl = document.getElementById('boot-loading');
      var tipEl = document.getElementById('boot-tip');

      var slowTimer = setTimeout(function () {
        if (tipEl) tipEl.textContent = '网络较慢，题库约 150KB，请继续等待，不要关闭页面…';
      }, 6000);

      function fail(msg) {
        clearTimeout(slowTimer);
        mainEl.innerHTML =
          '<div class="empty-state"><h2>' + msg + '</h2>' +
          '<p>请检查网络后刷新页面重试。</p></div>';
      }

      function start() {
        clearTimeout(slowTimer);
        if (!window.QUESTIONS_RAW || !window.QUESTIONS_RAW.length) { fail('题库加载失败'); return; }
        if (!window.Storage || !window.Router || !window.App) { fail('脚本加载失败'); return; }
        if (loadingEl && loadingEl.parentNode) loadingEl.parentNode.removeChild(loadingEl);
        window.App.init();
      }

      var s = document.createElement('script');
      s.src = 'data/questions.js?v=20261118';
      s.async = true;
      s.onload = start;
      s.onerror = function () { fail('题库加载失败'); };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
